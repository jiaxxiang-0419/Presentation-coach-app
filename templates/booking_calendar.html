<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Booking Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .slot { transition: all 0.2s ease; }
        
        /* グレーアウトされた過去の枠はホバーエフェクトを無効化 */
        .slot:not(.status-past):hover { transform: scale(1.05); z-index: 10; }
        
        /* 予約ステータス色設定 */
        .status-free { background-color: #ffffff; border-color: #e2e8f0; } 
        .status-booked-1 { background-color: #e0f2fe; border-color: #bae6fd; } 
        .status-booked-2 { background-color: #bae6fd; border-color: #7dd3fc; } 
        .status-unavailable { background-color: #f43f5e; border-color: #e11d48; } 
        /* 過去の時間のスタイル */
        .status-past { background-color: #f3f4f6; border-color: #e5e7eb; pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-12">

    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
            <h1 id="dateRange" class="text-4xl font-bold tracking-tight text-slate-900">
                ---
            </h1>
        </div>
        <div class="flex gap-2">
            <button onclick="changeWeek(-1)" class="px-4 py-2 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 font-medium text-sm transition-colors">前週</button>
            <button onclick="changeWeek(1)" class="px-4 py-2 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 font-medium text-sm transition-colors">翌週</button>
        </div>
    </header>        
        
        <div class="grid grid-cols-8 bg-slate-50/50 border-b border-slate-100">
            <div class="p-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-center">Time</div>
            <div class="p-2 text-center calendar-header-day"></div>
            <div class="p-2 text-center calendar-header-day"></div>
            <div class="p-2 text-center calendar-header-day"></div>
            <div class="p-2 text-center calendar-header-day"></div>
            <div class="p-2 text-center calendar-header-day"></div>
            <div class="p-2 text-center calendar-header-day"></div>
            <div class="p-2 text-center calendar-header-day"></div>
        </div>

            <div id="calendarBody" class="overflow-y-auto max-h-[600px] scrollbar-hide relative">
                <!-- Javascript will inject rows here -->
            </div>
        </div>
        
        <!-- 💡 「受付終了」に変更しました -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-8 bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
            <div class="flex items-center gap-3"><div class="w-5 h-5 bg-white border border-slate-200 rounded"></div><span class="text-sm text-slate-600">予約なし</span></div>
            <div class="flex items-center gap-3"><div class="w-5 h-5 bg-sky-100 border border-sky-200 rounded"></div><span class="text-sm text-slate-600">予約1件</span></div>
            <div class="flex items-center gap-3"><div class="w-5 h-5 bg-sky-300 border border-sky-400 rounded"></div><span class="text-sm text-slate-600">予約2件</span></div>
            <div class="flex items-center gap-3"><div class="w-5 h-5 bg-rose-500 rounded"></div><span class="text-sm text-slate-600">予約満</span></div>
            <div class="flex items-center gap-3"><div class="w-5 h-5 bg-gray-100 border border-gray-200 rounded"></div><span class="text-sm text-slate-600">受付終了</span></div>
        </div>
    </div>

<script>
        /* DATA_PLACEHOLDER */ 
        
        const container = document.getElementById('calendarBody');
        let currentWeekOffset = 0;

        function getMonday(offset) {
            const d = new Date();
            d.setDate(d.getDate() + (offset * 7));
            const day = d.getDay() || 7; 
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 1 - day);
            return d;
        }

        function renderCalendar() {
            container.innerHTML = '';
            
            const monday = getMonday(currentWeekOffset);
            const headers = document.querySelectorAll('.calendar-header-day');
            const days = ['月', '火', '水', '木', '金', '土', '日'];
            
            const now = new Date();
            
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                
                let colorClass = 'text-slate-700'; 
                if (i === 5) colorClass = 'text-blue-500'; 
                if (i === 6) colorClass = 'text-red-500';  

                headers[i].innerHTML = `
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] ${colorClass}">${days[i]}</span>
                        <span class="text-sm font-bold ${colorClass}">${d.getDate()}</span>
                    </div>
                `;
            }

            for (let h = 8; h < 24; h++) {
                for (let m = 0; m < 60; m += 20) {
                    const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                    const row = document.createElement('div');
                    row.className = "grid grid-cols-8 border-b border-slate-50 hover:bg-slate-50/50";
                    
                    // 💡 自動スクロール用の目印（ID）を付与
                    if (m === 0) {
                        row.id = `hour-${h}`;
                    }
                    
                    let html = `<div class="p-3 text-[10px] text-slate-400 font-mono text-center flex items-center justify-end pr-2">${timeStr}</div>`;
                    
                    for (let d = 0; d < 7; d++) {
                        const currentDate = new Date(monday);
                        currentDate.setDate(monday.getDate() + d);

                        const year = currentDate.getFullYear();
                        const monthIndex = currentDate.getMonth(); 
                        const month = String(monthIndex + 1).padStart(2, '0');
                        const dayStr = String(currentDate.getDate()).padStart(2, '0');
                        const dateStr = `${year}-${month}-${dayStr}`;
                        
                        const slotDateTime = new Date(year, monthIndex, currentDate.getDate(), h, m, 0);
                        const isPast = slotDateTime < now;

                        let className = 'status-free';

                        if (isPast) {
                            className = 'status-past';
                        } else {
                            const matchingBookings = bookings.filter(b => {
                                if (!b.start.startsWith(dateStr)) return false;
                                const timePart = b.start.length >= 16 ? b.start.substring(11, 16) : b.start;
                                return timePart === timeStr;
                            });
                            
                            const bookingCount = matchingBookings.length; 
                            
                            if (bookingCount === 1) {
                                className = 'status-booked-1'; 
                            } else if (bookingCount === 2) {
                                className = 'status-booked-2'; 
                            } else if (bookingCount >= 3) {
                                className = 'status-unavailable'; 
                            }
                        }
                        
                        html += `<div class="slot ${className} cursor-pointer m-0.5 rounded border"></div>`;
                    }
                    row.innerHTML = html;
                    container.appendChild(row);
                }
            }

            // 💡 現在の週を開いている場合のみ、今の時間の場所へ自動スクロールする
            if (currentWeekOffset === 0) {
                // 描画が完了するまでほんの少し（100ミリ秒）待ってからスクロール
                setTimeout(() => {
                    // 現在の時間を取得（8時未満なら8時、23時超えなら23時に丸める）
                    let targetHour = now.getHours();
                    targetHour = Math.max(8, Math.min(23, targetHour));
                    
                    const targetRow = document.getElementById(`hour-${targetHour}`);
                    if (targetRow) {
                        // 対象の行がコンテナの中央にくるようにスクロール位置を計算して滑らかに移動
                        const scrollPos = targetRow.offsetTop - (container.clientHeight / 2) + (targetRow.clientHeight / 2);
                        container.scrollTo({ top: scrollPos, behavior: 'smooth' });
                    }
                }, 100);
            }
        }

        function changeWeek(offset) {
            currentWeekOffset += offset;
            const m = getMonday(currentWeekOffset);
            const sun = new Date(m);
            sun.setDate(m.getDate() + 6);
            
            document.getElementById('dateRange').textContent = 
                `${m.toLocaleDateString('ja-JP')} - ${sun.toLocaleDateString('ja-JP')}`;
            renderCalendar();
        }

        changeWeek(0);
    </script>
</body>
</html>
